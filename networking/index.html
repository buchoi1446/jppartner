<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Networking English — 한러 비즈니스 네트워킹</title>
<style>
:root{--navy:#1F3A5F;--navy2:#2C5282;--bg:#F5F7FA;--line:#DCE3EC;--txt:#1F2937;--sub:#5B6575;--ok:#2F855A}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;background:var(--bg);color:var(--txt);-webkit-text-size-adjust:100%}
header{background:var(--navy);color:#fff;padding:16px 16px 0}
.top{position:sticky;top:0;z-index:5}
h1{font-size:17px;margin:0 0 4px;font-weight:600}
.subt{font-size:12px;opacity:.8;margin-bottom:10px}
.tabs{display:flex;gap:4px;overflow-x:auto}
.tab{flex:1;min-width:max-content;background:transparent;color:#cfd9e6;border:0;border-bottom:3px solid transparent;padding:10px 8px;font-size:14px;cursor:pointer}
.tab.on{color:#fff;border-bottom-color:#fff;font-weight:600}
.bar{background:#fff;border-bottom:1px solid var(--line);padding:10px 16px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;}
.bar label{font-size:12px;color:var(--sub);display:flex;align-items:center;gap:4px}
select,button{font-size:13px;font-family:inherit}
select{padding:6px;border:1px solid var(--line);border-radius:6px;background:#fff;max-width:150px}
.btn{padding:7px 12px;border-radius:6px;border:1px solid var(--navy);background:#fff;color:var(--navy);cursor:pointer}
.btn.pri{background:var(--navy);color:#fff}
.btn.on{background:var(--navy);color:#fff}
main{padding:12px 12px 80px;max-width:760px;margin:0 auto}
.sec{font-size:13px;font-weight:600;color:var(--navy);margin:18px 4px 8px}
.card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 12px 12px 14px;margin-bottom:8px;display:flex;gap:10px;align-items:flex-start}
.card.playing{border-color:var(--navy2);box-shadow:0 0 0 2px #BFD3EA}
.card.done{opacity:.55}
.num{font-size:12px;color:var(--sub);min-width:22px;padding-top:3px}
.body{flex:1;min-width:0}
.en{font-size:16px;line-height:1.5;font-weight:500}
.ko{font-size:13px;color:var(--sub);margin-top:4px;line-height:1.5}
.en.hid{color:transparent;background:#E8EDF3;border-radius:6px;cursor:pointer;user-select:none}
.en.hid::after{content:"탭해서 영어 보기";color:#8A96A8;font-size:12px;position:absolute}
.en.hid{position:relative}
.ko.hid{display:none}
.acts{display:flex;flex-direction:column;gap:6px}
.ic{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:#fff;cursor:pointer;font-size:15px;color:var(--navy);display:flex;align-items:center;justify-content:center}
.ic.play{background:var(--navy);color:#fff;border-color:var(--navy)}
.ic.chk.on{background:var(--ok);color:#fff;border-color:var(--ok)}
.tip{background:#EEF3F9;border-left:3px solid var(--navy);padding:10px 12px;font-size:13px;line-height:1.6;border-radius:0 8px 8px 0;margin:8px 0 12px}
.prog{font-size:12px;color:var(--sub);margin-left:auto}
.float{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;border-radius:999px;padding:10px 18px;font-size:13px;display:none;gap:12px;align-items:center;box-shadow:0 4px 14px rgba(0,0,0,.2);z-index:9}
.float button{background:#fff;color:var(--navy);border:0;border-radius:999px;padding:5px 12px;cursor:pointer}
.warn{display:none;background:#FFF4E5;color:#7A4B00;font-size:13px;padding:10px 12px;border-radius:8px;margin:10px 0}
</style>
</head>
<body>
<div class="top"><header>
<h1>Networking English</h1>
<div class="subt">한러 비즈니스 네트워킹 · 소리 듣고 따라 말하기</div>
<div class="tabs">
<button class="tab on" data-t="intro">3분 소개</button>
<button class="tab" data-t="phr">표현 30</button>
<button class="tab" data-t="q">질문</button>
</div>
</header>
<div class="bar">
<label>속도 <select id="rate"><option value="0.7">느리게</option><option value="0.85" selected>보통</option><option value="1">원어민</option></select></label>
<label>반복 <select id="rep"><option>1</option><option selected>2</option><option>3</option></select></label>
<label>음성 <select id="voice" onchange="this.dataset.picked=this.value"></select></label>
<button class="btn" id="mode">암기 모드</button>
<button class="btn pri" id="all">▶ 전체 재생</button>
<span class="prog" id="prog"></span>
</div></div>
<main id="main"></main>
<div class="float" id="float"><span id="ftxt">재생 중</span><button id="stop">정지</button></div>

<script>
const INTRO=[
["Good evening, everyone.","안녕하세요, 여러분."],
["My name is Byunguk Choi. Please just call me B.U.","최병욱입니다. 편하게 B.U.라고 불러주세요."],
["I'm a Korean patent attorney, and I'm the managing partner at Hangang IP Law Firm in Seoul.","한국 변리사이고, 서울 한강특허법인 대표 변리사입니다."],
["Simply put, my job is to protect ideas, names, and brands.","쉽게 말해 아이디어, 이름, 브랜드를 지키는 일을 합니다."],
["When a company creates something new, like a technology, a product name, a logo, or a character, I help them own it legally, in Korea and overseas.","회사가 기술, 제품명, 로고, 캐릭터 같은 새로운 것을 만들면 한국과 해외에서 법적으로 권리를 갖도록 돕습니다."],
["I've been doing this work for about sixteen years.","이 일을 16년 정도 해왔습니다."],
["I started my own firm with my partners in 2010.","2010년에 파트너들과 법인을 설립했습니다."],
["Today we have five patent attorneys, and we handle around one thousand cases a year.","현재 변리사 5명이 연간 약 1,000건을 처리합니다."],
["That includes about two hundred overseas cases in the US, Europe, Japan, and China.","그중 약 200건이 미국, 유럽, 일본, 중국 등 해외 사건입니다."],
["We work in many fields: software, AI, electronics, machines, medical devices, and also consumer brands like K-beauty and food.","소프트웨어, AI, 전자, 기계, 의료기기, 그리고 K-뷰티·식품 같은 소비자 브랜드까지 다룹니다."],
["Before that, I also worked in-house at LINE Plus, the company behind the LINE messenger.","그 전에는 라인 메신저 회사인 라인플러스에서 사내 변리사로 일했습니다."],
["That was a great experience. I saw how a fast-moving tech company thinks about IP from the inside.","좋은 경험이었습니다. 빠르게 움직이는 IT 회사가 IP를 어떻게 보는지 안에서 배웠습니다."],
["Speed matters, budgets matter, and the legal work has to support the business, not slow it down.","속도와 예산이 중요하고, 법률 업무는 사업을 늦추는 게 아니라 도와야 합니다."],
["I still work that way with my clients today.","지금도 고객과 그렇게 일합니다."],
["Now, I know many of you are in the game industry, so let me say one thing about games.","게임 업계 분들이 많으신 것 같아 게임 이야기를 하나 드리겠습니다."],
["In games, the brand is everything.","게임에서는 브랜드가 전부입니다."],
["The game title, the character names, the logo. That is what players remember.","게임 제목, 캐릭터 이름, 로고. 플레이어가 기억하는 건 그것입니다."],
["But many companies register their trademark too late.","그런데 많은 회사가 상표 등록을 너무 늦게 합니다."],
["They launch the game, it becomes popular, and then they find out someone else already registered the name in another country.","게임을 출시해 인기를 얻고 나서야 다른 나라에서 누가 먼저 이름을 등록한 걸 알게 됩니다."],
["Sometimes they have to change the name, or pay a lot to get it back.","이름을 바꾸거나 큰돈을 주고 되찾아야 할 때도 있습니다."],
["So my simple advice is this: protect the name before you announce it.","그래서 제 조언은 간단합니다. 발표하기 전에 이름부터 지키세요."],
["And think about the countries you will enter in the next two or three years, not just Korea.","그리고 한국만이 아니라 앞으로 2~3년 안에 진출할 나라를 생각하세요."],
["Technology can be protected too.","기술도 보호할 수 있습니다."],
["Things like server systems, matching systems, or new user interfaces can sometimes be patented.","서버 시스템, 매칭 시스템, 새로운 UI 같은 것도 특허가 될 수 있습니다."],
["Big companies like Nintendo actively use game patents, so this is becoming more important.","닌텐도 같은 대기업도 게임 특허를 적극 활용하고 있어서 점점 더 중요해지고 있습니다."],
["If you are planning to go global, or if you just have a question about a name or an idea, I'm always happy to have a quick chat.","해외 진출을 계획하시거나 이름이나 아이디어에 관해 궁금한 게 있으시면 언제든 편하게 이야기 나눠요."],
["No pressure at all.","부담 갖지 마세요."],
["Thank you. I look forward to talking with all of you tonight.","감사합니다. 오늘 밤 여러분과 이야기 나누길 기대합니다."]
];
const PHR=[
{s:"아이스브레이킹",i:[
["Hi, I'm B.U. Choi. Nice to meet you. What brings you here tonight?","안녕하세요, 반갑습니다. 오늘 어떻게 오셨어요?"],
["Is this your first time at this event?","이 모임 처음 오셨어요?"],
["How do you know the organizers?","주최 측과는 어떻게 아세요?"],
["The food looks great. Have you tried anything yet?","음식 좋아 보이네요. 뭐 드셔보셨어요?"],
["How long have you been in Korea?","한국에 오신 지 얼마나 되셨어요?"],
["I've always wanted to visit Russia. Which city would you recommend?","러시아 꼭 가보고 싶었어요. 어느 도시를 추천하세요?"]]},
{s:"내 소개",i:[
["I'm a patent attorney. Basically, I help companies protect their ideas and brands.","변리사입니다. 쉽게 말해 회사의 아이디어와 브랜드를 지켜드립니다."],
["I've been in this field for about sixteen years.","이 분야에서 16년 정도 일했습니다."],
["I run an IP law firm in Seoul with my partners.","서울에서 파트너들과 특허법인을 운영합니다."],
["I used to work in-house at LINE Plus, the LINE messenger company.","예전에 라인플러스에서 사내 변리사로 일했습니다."],
["So I understand both sides, the law firm side and the company side.","그래서 로펌 입장과 회사 입장을 둘 다 압니다."],
["I mostly work with tech companies and startups.","주로 기술 기업과 스타트업과 일합니다."]]},
{s:"회사 소개",i:[
["Our firm is called Hangang IP. Hangang means the Han River.","회사 이름은 한강특허법인입니다. 한강이라는 뜻이에요."],
["We handle about a thousand cases a year.","연간 약 1,000건을 처리합니다."],
["We file in the US, Europe, Japan, China, and many other countries.","미국, 유럽, 일본, 중국 등 여러 나라에 출원합니다."],
["We cover software, AI, electronics, medical devices, and consumer brands.","소프트웨어, AI, 전자, 의료기기, 소비자 브랜드를 다룹니다."],
["We're not a huge firm, so clients work directly with me, not a junior.","대형 로펌이 아니라서 고객은 주니어가 아니라 저와 직접 일합니다."],
["We try to be fast, clear, and practical.","빠르고, 명확하고, 실용적으로 일합니다."]]},
{s:"게임 산업 연결",i:[
["In the game industry, the name is your most valuable asset.","게임 산업에서는 이름이 가장 중요한 자산입니다."],
["Do you usually register the game title before launch?","보통 출시 전에 게임 이름 상표 등록하세요?"],
["A common problem is that someone registers your name first in another country.","흔한 문제는 다른 나라에서 누가 먼저 이름을 등록하는 겁니다."],
["It's much cheaper to protect a name early than to fight for it later.","나중에 싸우는 것보다 미리 등록하는 게 훨씬 저렴합니다."],
["Character names and logos can be protected too, not just the title.","제목뿐 아니라 캐릭터 이름과 로고도 보호할 수 있어요."],
["Some game technology, like matching or server systems, can be patented.","매칭이나 서버 시스템 같은 게임 기술도 특허가 될 수 있습니다."],
["Which markets are you targeting next?","다음에 어느 시장을 노리고 계세요?"]]},
{s:"마무리·후속 연락",i:[
["That's really interesting. I'd love to hear more about it.","정말 흥미롭네요. 더 듣고 싶습니다."],
["Can I get your card? Here's mine.","명함 주시겠어요? 제 명함입니다."],
["If you ever have a quick IP question, feel free to email me. No charge for a quick chat.","간단한 IP 질문은 편하게 메일 주세요. 짧은 상담은 무료입니다."],
["Let me introduce you to someone. I think you two should talk.","소개해 드릴 분이 있어요. 두 분이 얘기 나눠보시면 좋겠어요."],
["It was great meeting you. Let's stay in touch.","만나서 반가웠습니다. 계속 연락해요."]]}
];
const Q=[
{s:"상대가 말하게 만드는 질문",i:[
["What does your company do?","어떤 일을 하는 회사세요?"],
["What kind of games do you make?","어떤 게임을 만드세요?"],
["Are you working on anything new right now?","요즘 새로 준비하는 게 있으세요?"],
["Which countries are your biggest markets?","가장 큰 시장은 어느 나라예요?"],
["What's the hardest part of going global?","해외 진출에서 가장 어려운 점이 뭐예요?"],
["How did you start working with Korea?","한국과는 어떻게 일하게 되셨어요?"],
["Do you work with an IP firm now, or do you handle it in-house?","지금 IP는 외부 사무소와 하세요, 내부에서 하세요?"],
["What kind of partners are you looking for?","어떤 파트너를 찾고 계세요?"]]},
{s:"실무 한마디",i:[
["Russia is also a Madrid member, so you can file a trademark there through one international application.","러시아도 마드리드 가입국이라 국제출원 하나로 상표를 낼 수 있어요."],
["Sorry, could you say that again a little slower?","죄송한데 조금 천천히 다시 말씀해 주시겠어요?"],
["Excuse me, I'm going to grab a drink. It was really nice talking to you.","음료 좀 가져올게요. 이야기 즐거웠습니다."]]}
];

const $=s=>document.querySelector(s);
let tab="intro",memo=false,voices=[],queue=[],qi=0,running=false;
let done={};try{done=JSON.parse(localStorage.getItem("nw_done")||"{}")}catch(e){}
function save(){try{localStorage.setItem("nw_done",JSON.stringify(done))}catch(e){}}
const synth=window.speechSynthesis;

const MALE=["Microsoft Andrew","Microsoft Guy","Microsoft Christopher","Microsoft Brian","Microsoft Eric","Microsoft Davis","Microsoft Roger","Microsoft Steffan","Microsoft Mark","Microsoft David","Aaron","Evan","Nathan","Tom","Alex","Fred","Reed","Ralph","Rocko","en-us-x-iom","en-us-x-tpd","en-us-x-iol","Male"];
let hasMale=false;
function isMale(v){return MALE.some(p=>v.name.includes(p))}
function loadVoices(){
  if(!synth)return;
  let all=synth.getVoices().filter(v=>/^en[-_]/i.test(v.lang));
  const us=all.filter(v=>/^en[-_]US/i.test(v.lang));
  voices=us.length?us:all;
  const rank=v=>{const i=MALE.findIndex(p=>v.name.includes(p));return i<0?99:i};
  voices.sort((a,b)=>rank(a)-rank(b));
  hasMale=voices.length>0&&isMale(voices[0]);
  const sel=$("#voice"),cur=sel.dataset.picked;sel.innerHTML="";
  voices.forEach((v,i)=>{const o=document.createElement("option");o.value=i;o.textContent=(isMale(v)?"남 · ":"")+v.name.replace(/Microsoft |Google /,"").replace(/ Online \(Natural\)/,"")+" ("+v.lang+")";sel.appendChild(o)});
  if(cur&&cur<voices.length)sel.value=cur;
}
if(synth){loadVoices();synth.onvoiceschanged=loadVoices}

function items(){
  if(tab==="intro")return [{s:null,i:INTRO}];
  return tab==="phr"?PHR:Q;
}
function render(){
  const m=$("#main");m.innerHTML="";
  if(!synth){const w=document.createElement("div");w.className="warn";w.style.display="block";w.textContent="이 브라우저는 음성 재생을 지원하지 않습니다. Chrome 또는 Safari에서 열어 주세요.";m.appendChild(w)}
  if(tab==="intro"){const t=document.createElement("div");t.className="tip";t.innerHTML="문장 단위로 끊어 놓았습니다. <b>전체 재생</b>으로 흐름을 듣고, 막히는 문장만 반복하세요. 숫자(16 years, 1,000 cases)와 LINE Plus, protect the name before you announce it에서 잠깐 쉬어 말하면 기억에 남습니다.";m.appendChild(t)}
  let n=0,total=0,dn=0;
  items().forEach(g=>{
    if(g.s){const h=document.createElement("div");h.className="sec";h.textContent=g.s;m.appendChild(h)}
    g.i.forEach(([en,ko])=>{
      n++;total++;const id=tab+n;if(done[id])dn++;
      const c=document.createElement("div");c.className="card"+(done[id]?" done":"");c.dataset.id=id;c.dataset.en=en;
      c.innerHTML=`<div class="num">${n}</div><div class="body"><div class="en${memo?" hid":""}">${en}</div><div class="ko">${ko}</div></div><div class="acts"><button class="ic play" aria-label="듣기">▶</button><button class="ic chk${done[id]?" on":""}" aria-label="외움">✓</button></div>`;
      c.querySelector(".play").onclick=()=>{stopAll();playList([c])};
      c.querySelector(".en").onclick=e=>e.currentTarget.classList.remove("hid");
      c.querySelector(".chk").onclick=e=>{done[id]=!done[id];if(!done[id])delete done[id];save();render()};
      m.appendChild(c);
    });
  });
  $("#prog").textContent=`외움 ${dn}/${total}`;
}

function speak(text,cb){
  const u=new SpeechSynthesisUtterance(text);
  const v=voices[+$("#voice").value];if(v)u.voice=v;u.lang=v?v.lang:"en-US";
  u.rate=+$("#rate").value;u.pitch=(v&&isMale(v))?1:0.8;u.onend=cb;u.onerror=cb;synth.speak(u);
}
function playList(cards){
  if(!synth)return;
  const rep=+$("#rep").value;queue=[];cards.forEach(c=>{for(let r=0;r<rep;r++)queue.push(c)});
  qi=0;running=true;$("#float").style.display="flex";next();
}
function next(){
  document.querySelectorAll(".card.playing").forEach(c=>c.classList.remove("playing"));
  if(!running||qi>=queue.length){stopAll();return}
  const c=queue[qi++];c.classList.add("playing");
  c.scrollIntoView({block:"center",behavior:"smooth"});
  $("#ftxt").textContent=`재생 중 ${qi}/${queue.length}`;
  speak(c.dataset.en,()=>setTimeout(next,running?900:0));
}
function stopAll(){
  running=false;if(synth)synth.cancel();
  $("#float").style.display="none";
  document.querySelectorAll(".card.playing").forEach(c=>c.classList.remove("playing"));
}
$("#stop").onclick=stopAll;
$("#all").onclick=()=>{stopAll();const cs=[...document.querySelectorAll(".card")].filter(c=>!c.classList.contains("done"));playList(cs.length?cs:[...document.querySelectorAll(".card")])};
$("#mode").onclick=e=>{memo=!memo;e.currentTarget.classList.toggle("on",memo);e.currentTarget.textContent=memo?"영어 보기":"암기 모드";render()};
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{stopAll();tab=b.dataset.t;document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("on",x===b));render()});
render();
</script>
</body>
</html>
